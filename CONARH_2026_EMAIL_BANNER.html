<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CONARH 2026 - Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
        }

        .banner-container {
            max-width: 600px;
            margin: 0 auto;
            background: linear-gradient(135deg, #2D1B3D 0%, #1a0f24 100%);
            position: relative;
            overflow: hidden;
            min-height: 500px;
            display: table;
            width: 100%;
        }

        .banner-inner {
            display: table-cell;
            vertical-align: middle;
            padding: 40px 20px;
            position: relative;
            z-index: 2;
        }

        .content-wrapper {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .left-col {
            display: table-cell;
            width: 35%;
            vertical-align: middle;
            padding-right: 15px;
        }

        .center-col {
            display: table-cell;
            width: 65%;
            vertical-align: middle;
            text-align: center;
        }

        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-img {
            max-width: 140px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .tagline-text {
            font-size: 13px;
            line-height: 1.4;
            color: #ffffff;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 12px;
        }

        .tagline-text .brasil {
            color: #E63D5F;
            display: block;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .tagline-text .global {
            color: #E63D5F;
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .tagline-text .futuro {
            color: #ffffff;
            font-size: 12px;
            line-height: 1.3;
        }

        /* Main Text */
        .hero-title {
            font-size: 36px;
            font-weight: 300;
            color: #ffffff;
            margin-bottom: 8px;
            line-height: 1.1;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hero-subtitle {
            font-size: 32px;
            font-weight: 300;
            color: #ffffff;
            margin-bottom: 12px;
            line-height: 1.2;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .hero-subtitle-end {
            font-size: 28px;
            font-weight: 300;
            color: #ffffff;
            margin-bottom: 16px;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .hero-description {
            font-size: 12px;
            color: #ffffff;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .hero-description strong {
            color: #D4AF37;
            font-weight: 700;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(90deg, #E63D5F 0%, #ff5577 100%);
            color: #ffffff;
            padding: 13px 32px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 4px 15px rgba(230, 61, 95, 0.35);
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            background: linear-gradient(90deg, #d92d52 0%, #ff3d6a 100%);
            box-shadow: 0 6px 20px rgba(230, 61, 95, 0.5);
        }

        /* Digital Element */
        .digital-element {
            display: table-cell;
            width: 25%;
            vertical-align: middle;
            text-align: right;
            padding-left: 10px;
        }

        .fingerprint-container {
            width: 140px;
            height: 190px;
            margin-left: auto;
            filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.25));
        }

        .fingerprint-svg {
            width: 100%;
            height: 100%;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .banner-inner {
                padding: 30px 16px;
            }

            .content-wrapper {
                display: block;
            }

            .left-col,
            .center-col,
            .digital-element {
                display: block;
                width: 100%;
                padding: 0;
                margin-bottom: 20px;
            }

            .hero-title {
                font-size: 28px;
            }

            .hero-subtitle {
                font-size: 24px;
            }

            .hero-subtitle-end {
                font-size: 20px;
            }

            .fingerprint-container {
                width: 120px;
                height: 160px;
                margin: 20px auto 0;
            }

            .digital-element {
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .banner-inner {
                padding: 24px 12px;
            }

            .banner-container {
                min-height: auto;
            }

            .hero-title {
                font-size: 24px;
            }

            .hero-subtitle {
                font-size: 20px;
            }

            .hero-subtitle-end {
                font-size: 18px;
            }

            .hero-description {
                font-size: 11px;
            }

            .logo-img {
                max-width: 100px;
            }

            .tagline-text {
                font-size: 11px;
            }

            .tagline-text .brasil,
            .tagline-text .global {
                font-size: 12px;
            }

            .fingerprint-container {
                width: 100px;
                height: 140px;
            }
        }
    </style>
</head>
