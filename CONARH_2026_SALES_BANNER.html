<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CONARH 2026 - Vendas Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
        }

        .banner-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9ff 100%);
            position: relative;
            overflow: hidden;
        }

        .banner-container {
            padding: 30px 20px;
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .banner-left {
            display: table-cell;
            width: 50%;
            vertical-align: middle;
            padding-right: 15px;
        }

        .banner-right {
            display: table-cell;
            width: 50%;
            vertical-align: middle;
            text-align: center;
            padding-left: 10px;
        }

        /* Left Content */
        .content-text h2 {
            font-size: 24px;
            font-weight: 700;
            color: #2D1B3D;
            line-height: 1.3;
            margin-bottom: 12px;
            font-family: Arial, sans-serif;
        }

        .content-text h2 .highlight {
            color: #E63D5F;
        }

        .content-text p {
            font-size: 13px;
            color: #555555;
            line-height: 1.6;
            margin-bottom: 16px;
            font-family: Arial, sans-serif;
        }

        .content-text ul {
            list-style: none;
            margin-bottom: 16px;
            font-size: 12px;
            color: #555555;
            font-family: Arial, sans-serif;
        }

        .content-text ul li {
            padding-left: 18px;
            margin-bottom: 6px;
            position: relative;
            line-height: 1.5;
        }

        .content-text ul li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #E63D5F;
            font-weight: 700;
            font-size: 14px;
        }

        .cta-section {
            margin-top: 16px;
        }

        .price-tag {
            display: inline-block;
            background: #E63D5F;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            font-family: Arial, sans-serif;
        }

        .price-tag .label {
            display: block;
            font-size: 10px;
            font-weight: 500;
            opacity: 0.9;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(90deg, #E63D5F 0%, #ff5577 100%);
            color: #ffffff;
            padding: 12px 28px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 4px 15px rgba(230, 61, 95, 0.35);
            transition: all 0.3s ease;
            font-family: Arial, sans-serif;
            border: none;
            cursor: pointer;
        }

        .cta-button:hover {
            background: linear-gradient(90deg, #d92d52 0%, #ff3d6a 100%);
            box-shadow: 0 6px 20px rgba(230, 61, 95, 0.5);
        }

        /* Right Image */
        .image-container {
            text-align: center;
        }

        .illustration {
            max-width: 220px;
            height: auto;
            display: inline-block;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .banner-container {
                display: block;
                padding: 24px 16px;
            }

            .banner-left,
            .banner-right {
                display: block;
                width: 100%;
                padding: 0;
                margin-bottom: 20px;
            }

            .banner-right {
                margin-bottom: 0;
            }

            .content-text h2 {
                font-size: 20px;
            }

            .content-text p {
                font-size: 12px;
            }

            .content-text ul {
                font-size: 11px;
            }

            .illustration {
                max-width: 180px;
            }
        }

        @media (max-width: 480px) {
            .banner-container {
                padding: 20px 12px;
            }

            .content-text h2 {
                font-size: 18px;
                margin-bottom: 10px;
            }

            .content-text p {
                font-size: 11px;
                margin-bottom: 12px;
            }

            .content-text ul {
                font-size: 10px;
                margin-bottom: 12px;
            }

            .content-text ul li {
                margin-bottom: 4px;
            }

            .price-tag {
                font-size: 12px;
                padding: 6px 10px;
            }

            .cta-button {
                padding: 10px 24px;
                font-size: 12px;
            }

            .illustration {
                max-width: 150px;
            }
        }
    </style>
</head>
