<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CONARH 2026 - Urgência Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
        }

        .banner-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background: linear-gradient(135deg, #2D1B3D 0%, #1a0f24 100%);
            position: relative;
            overflow: hidden;
        }

        .banner-container {
            padding: 0;
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .banner-image {
            display: table-cell;
            width: 100%;
            vertical-align: middle;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 560px;
        }

        .main-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        .overlay-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(45, 27, 61, 0.95), transparent);
            padding: 24px 20px 20px;
            text-align: center;
        }

        .overlay-text h3 {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-family: Arial, sans-serif;
        }

        .overlay-text p {
            font-size: 12px;
            color: #ffffff;
            line-height: 1.5;
            margin-bottom: 14px;
            font-family: Arial, sans-serif;
        }

        .urgency-badge {
            display: inline-block;
            background: #E63D5F;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(90deg, #E63D5F 0%, #ff5577 100%);
            color: #ffffff;
            padding: 12px 32px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 4px 15px rgba(230, 61, 95, 0.35);
            transition: all 0.3s ease;
            font-family: Arial, sans-serif;
            border: none;
            cursor: pointer;
        }

        .cta-button:hover {
            background: linear-gradient(90deg, #d92d52 0%, #ff3d6a 100%);
            box-shadow: 0 6px 20px rgba(230, 61, 95, 0.5);
        }

        .bottom-section {
            background: linear-gradient(135deg, #2D1B3D 0%, #1a0f24 100%);
            padding: 20px;
            text-align: center;
        }

        .benefits-list {
            display: table;
            width: 100%;
            margin-bottom: 16px;
        }

        .benefit-item {
            display: table-cell;
            width: 33.33%;
            padding: 0 8px;
            font-size: 11px;
            color: #ffffff;
            line-height: 1.4;
            font-family: Arial, sans-serif;
        }

        .benefit-icon {
            font-size: 16px;
            margin-bottom: 4px;
            display: block;
        }

        .final-cta {
            margin-top: 16px;
        }

        .final-cta p {
            font-size: 12px;
            color: #D4AF37;
            margin-bottom: 12px;
            font-weight: 700;
            font-family: Arial, sans-serif;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .banner-container {
                padding: 16px;
            }

            .overlay-content {
                padding: 20px 16px 16px;
            }

            .overlay-text h3 {
                font-size: 12px;
            }

            .overlay-text p {
                font-size: 11px;
            }

            .benefit-item {
                font-size: 10px;
            }

            .cta-button {
                padding: 10px 24px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .banner-container {
                padding: 12px;
            }

            .overlay-content {
                padding: 16px 12px 12px;
            }

            .overlay-text h3 {
                font-size: 11px;
                margin-bottom: 8px;
            }

            .overlay-text p {
                font-size: 10px;
                margin-bottom: 10px;
            }

            .urgency-badge {
                font-size: 11px;
                padding: 6px 12px;
                margin-bottom: 10px;
            }

            .benefit-item {
                font-size: 9px;
            }

            .benefit-icon {
                font-size: 14px;
            }

            .cta-button {
                padding: 10px 20px;
                font-size: 11px;
            }

            .final-cta p {
                font-size: 11px;
            }
        }
    </style>
